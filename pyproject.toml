[project]
name = "semagram"
version = "0.1.0"
description = "Circular attention as a boundary-value problem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.3",
    "numpy>=1.26",
