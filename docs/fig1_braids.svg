<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica,Arial,sans-serif"><title>Braid words and their closures</title><rect width="720" height="320" fill="none"/><text x="24.0" y="30.0" font-size="16" fill="#5b6470" text-anchor="start" font-weight="600">A braid word is a token sequence; its closure is a knot</text><text x="24.0" y="52.0" font-size="13" fill="#8c95a1" text-anchor="start" font-weight="normal">The model input is the token sequence — integers, not pixels. The drawing is for the reader.</text><text x="24.0" y="72.0" font-size="12" fill="#2f7d5d" text-anchor="start" font-weight="normal">encode(σ₁σ₁σ₁) → [2, 2, 2, 0, 0, …]     target: the Jones polynomial of the closure</text><path d="M 90.0 128.0 C 113.0 128.0 113.0 168.0 136.0 168.0 C 159.0 168.0 159.0 128.0 182.0 128.0 C 205.0 128.0 205.0 168.0 228.0 168.0" fill="none" stroke="#4a6fa5" stroke-width="2.4" stroke-linecap="round"/><path d="M 90.0 168.0 C 113.0 168.0 113.0 128.0 136.0 128.0 C 159.0 128.0 159.0 168.0 182.0 168.0 C 205.0 168.0 205.0 128.0 228.0 128.0" fill="none" stroke="#4a6fa5" stroke-width="2.4" stroke-linecap="round"/><path d="M 228.0 128.0 C 242.0 128.0 242.0 114.0 226.6 114.0 L 90.0 114.0 C 76.0 114.0 76.0 128.0 90.0 128.0" fill="none" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M 228.0 168.0 C 251.0 168.0 251.0 114.0 225.7 114.0 L 90.0 114.0 C 67.0 114.0 67.0 168.0 90.0 168.0" fill="none" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="4 3"/><text x="90.0" y="196.0" font-size="14" fill="#4a6fa5" text-anchor="start" font-weight="normal">σ₁ σ₁ σ₁</text><text x="90.0" y="215.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">trefoil</text><text x="90.0" y="234.0" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal">V = +0.118 -1.740i</text><path d="M 330.0 128.0 C 353.0 128.0 353.0 168.0 376.0 168.0 C 399.0 168.0 399.0 208.0 422.0 208.0 C 445.0 208.0 445.0 208.0 468.0 208.0 C 491.0 208.0 491.0 168.0 514.0 168.0" fill="none" stroke="#4a6fa5" stroke-width="2.4" stroke-linecap="round"/><path d="M 330.0 168.0 C 353.0 168.0 353.0 128.0 376.0 128.0 C 399.0 128.0 399.0 128.0 422.0 128.0 C 445.0 128.0 445.0 168.0 468.0 168.0 C 491.0 168.0 491.0 208.0 514.0 208.0" fill="none" stroke="#4a6fa5" stroke-width="2.4" stroke-linecap="round"/><path d="M 330.0 208.0 C 353.0 208.0 353.0 208.0 376.0 208.0 C 399.0 208.0 399.0 168.0 422.0 168.0 C 445.0 168.0 445.0 128.0 468.0 128.0 C 491.0 128.0 491.0 128.0 514.0 128.0" fill="none" stroke="#4a6fa5" stroke-width="2.4" stroke-linecap="round"/><circle cx="399.0" cy="188.0" r="5.5" fill="#ffffff" opacity="0.92"/><circle cx="491.0" cy="188.0" r="5.5" fill="#ffffff" opacity="0.92"/><path d="M 514.0 128.0 C 528.0 128.0 528.0 114.0 512.6 114.0 L 330.0 114.0 C 316.0 114.0 316.0 128.0 330.0 128.0" fill="none" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M 514.0 168.0 C 537.0 168.0 537.0 114.0 511.7 114.0 L 330.0 114.0 C 307.0 114.0 307.0 168.0 330.0 168.0" fill="none" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M 514.0 208.0 C 546.0 208.0 546.0 114.0 510.8 114.0 L 330.0 114.0 C 298.0 114.0 298.0 208.0 330.0 208.0" fill="none" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="4 3"/><text x="330.0" y="236.0" font-size="14" fill="#4a6fa5" text-anchor="start" font-weight="normal">σ₁ σ₂⁻¹ σ₁ σ₂⁻¹</text><text x="330.0" y="255.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">figure-eight</text><text x="330.0" y="274.0" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal">V = -0.951 -0.000i</text><text x="560.0" y="138.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">Two words can present</text><text x="560.0" y="155.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">the same knot while</text><text x="560.0" y="172.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">looking nothing alike.</text><text x="560.0" y="196.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">Telling them apart has</text><text x="560.0" y="213.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">no local shortcut —</text><text x="560.0" y="230.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">that is why the symmetry</text><text x="560.0" y="247.0" font-size="12" fill="#8c95a1" text-anchor="start" font-weight="normal">is worth building in.</text></svg>
