<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" font-family="Helvetica,Arial,sans-serif"><title>Invariance versus extrapolation</title><text x="24.0" y="30.0" font-size="16" fill="#5b6470" text-anchor="start" font-weight="600">The gain is traceable to invariance, not to the architecture</text><text x="24.0" y="52.0" font-size="13" fill="#8c95a1" text-anchor="start" font-weight="normal">R-III ratio measured on word pairs that never appear in training  (r = −0.994)</text><line x1="110" y1="250" x2="110" y2="80" stroke="#5b6470" stroke-width="1.4"/><line x1="110" y1="250" x2="510" y2="250" stroke="#5b6470" stroke-width="1.4"/><line x1="160.0" y1="250" x2="160.0" y2="255" stroke="#5b6470" stroke-width="1.2"/><text x="160.0" y="270.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">0.9</text><line x1="243.3" y1="250" x2="243.3" y2="255" stroke="#5b6470" stroke-width="1.2"/><text x="243.3" y="270.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">0.8</text><line x1="326.7" y1="250" x2="326.7" y2="255" stroke="#5b6470" stroke-width="1.2"/><text x="326.7" y="270.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">0.7</text><line x1="410.0" y1="250" x2="410.0" y2="255" stroke="#5b6470" stroke-width="1.2"/><text x="410.0" y="270.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">0.6</text><line x1="493.3" y1="250" x2="493.3" y2="255" stroke="#5b6470" stroke-width="1.2"/><text x="493.3" y="270.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">0.5</text><line x1="105" y1="250.0" x2="510" y2="250.0" stroke="#c8ced6" stroke-width="0.8"/><text x="101.0" y="254.0" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.10</text><line x1="105" y1="207.5" x2="510" y2="207.5" stroke="#c8ced6" stroke-width="0.8"/><text x="101.0" y="211.5" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.15</text><line x1="105" y1="165.0" x2="510" y2="165.0" stroke="#c8ced6" stroke-width="0.8"/><text x="101.0" y="169.0" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.20</text><line x1="105" y1="122.5" x2="510" y2="122.5" stroke="#c8ced6" stroke-width="0.8"/><text x="101.0" y="126.5" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.25</text><line x1="105" y1="80.0" x2="510" y2="80.0" stroke="#c8ced6" stroke-width="0.8"/><text x="101.0" y="84.0" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.30</text><text x="310.0" y="290.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">more invariant  →        (Reidemeister-III ratio)</text><g transform="translate(64,165.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">extrapolation R²</text></g><path d="M 150.0 226.2 L 307.5 176.9 L 457.5 108.0" fill="none" stroke="#2f7d5d" stroke-width="2.4"/><circle cx="150.0" cy="226.2" r="6" fill="#2f7d5d"/><text x="150.0" y="200.2" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">braid</text><text x="150.0" y="213.2" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">no penalty</text><circle cx="307.5" cy="176.9" r="6" fill="#2f7d5d"/><text x="307.5" y="150.9" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">untied</text><text x="307.5" y="163.9" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">w=10</text><circle cx="457.5" cy="108.0" r="6" fill="#2f7d5d"/><text x="457.5" y="82.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">tied</text><text x="457.5" y="95.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">w=10</text><line x1="110" y1="187.1" x2="510" y2="187.1" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="6 4"/><text x="116.0" y="180.1" font-size="11" fill="#8c95a1" text-anchor="start" font-weight