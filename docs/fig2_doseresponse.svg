<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" font-family="Helvetica,Arial,sans-serif"><title>Yang-Baxter dose-response</title><text x="24.0" y="30.0" font-size="16" fill="#5b6470" text-anchor="start" font-weight="600">Extrapolation tracks how closely the braid relation holds</text><text x="24.0" y="52.0" font-size="13" fill="#8c95a1" text-anchor="start" font-weight="normal">Same network, same data — only the Yang–Baxter penalty weight varies</text><line x1="90" y1="300" x2="90" y2="80" stroke="#5b6470" stroke-width="1.4"/><line x1="90" y1="300" x2="560" y2="300" stroke="#5b6470" stroke-width="1.4"/><line x1="49.0" y1="300" x2="49.0" y2="305" stroke="#5b6470" stroke-width="1.2"/><text x="49.0" y="320.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">10⁻⁴</text><line x1="205.2" y1="300" x2="205.2" y2="305" stroke="#5b6470" stroke-width="1.2"/><text x="205.2" y="320.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">10⁻³</text><line x1="361.4" y1="300" x2="361.4" y2="305" stroke="#5b6470" stroke-width="1.2"/><text x="361.4" y="320.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">10⁻²</text><line x1="517.5" y1="300" x2="517.5" y2="305" stroke="#5b6470" stroke-width="1.2"/><text x="517.5" y="320.0" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal">10⁻¹</text><line x1="85" y1="257.7" x2="560" y2="257.7" stroke="#c8ced6" stroke-width="0.8"/><text x="81.0" y="261.7" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.05</text><line x1="85" y1="215.4" x2="560" y2="215.4" stroke="#c8ced6" stroke-width="0.8"/><text x="81.0" y="219.4" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.10</text><line x1="85" y1="173.1" x2="560" y2="173.1" stroke="#c8ced6" stroke-width="0.8"/><text x="81.0" y="177.1" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.15</text><line x1="85" y1="130.8" x2="560" y2="130.8" stroke="#c8ced6" stroke-width="0.8"/><text x="81.0" y="134.8" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.20</text><line x1="85" y1="88.5" x2="560" y2="88.5" stroke="#c8ced6" stroke-width="0.8"/><text x="81.0" y="92.5" font-size="11" fill="#5b6470" text-anchor="end" font-weight="normal">0.25</text><text x="325.0" y="340.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">Yang–Baxter residual  (lower = closer to a braid representation)</text><g transform="translate(44,190.0) rotate(-90)"><text x="0.0" y="0.0" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal">extrapolation R²</text></g><path d="M 528.8 180.7 L 485.9 170.5 L 396.6 131.6 L 345.3 119.8 L 287.2 109.6 L 214.7 124.0 L 121.2 139.2" fill="none" stroke="#c0562e" stroke-width="2.4"/><circle cx="528.8" cy="180.7" r="4.5" fill="#ffffff" stroke="#c0562e" stroke-width="2"/><circle cx="485.9" cy="170.5" r="4.5" fill="#ffffff" stroke="#c0562e" stroke-width="2"/><circle cx="396.6" cy="131.6" r="4.5" fill="#ffffff" stroke="#c0562e" stroke-width="2"/><circle cx="345.3" cy="119.8" r="4.5" fill="#ffffff" stroke="#c0562e" stroke-width="2"/><circle cx="287.2" cy="109.6" r="6.5" fill="#c0562e" stroke="#c0562e" stroke-width="2"/><circle cx="214.7" cy="124.0" r="4.5" fill="#ffffff" stroke="#c0562e" stroke-width="2"/><circle cx="121.2" cy="139.2" r="4.5" fill="#ffffff" stroke="#c0562e" stroke-width="2"/><text x="287.2" y="93.6" font-size="12" fill="#c0562e" text-anchor="middle" font-weight="600">peak  w=10</text><text x="534.8" y="200.7" font-size="11" fill="#8c95a1" text-anchor="start" font-weight="normal">no penalty</text><text x="121.2" y="163.2" font-size="11" fill="#8c95a1" text-anchor="middle" font-weight="normal">hardest enforcement</text><line x1="90" y1="275.5" x2="560" y2="275.5" stroke="#8c95a1" stroke-width="1.6" stroke-dasharray="6 4"/><text x="560.0" y="267.5" font-size="11" fill="#8c95a1" text-anchor="end" font-weight="normal">parameter-matched transformer</text><text x="100.0" y="92.7" font-size="12" fill="#5b6470" text-anchor="start" font-weight="600">approximate invariance beats exact</text></svg>
